<head>

   <script>
        alert("Let's add two numbers together!");

        let num1 = Number(prompt("What is your first number?"));
        let num2 = Number(prompt("What is your second number?"));

        let total = num1 + num2;
        
        alert("The numbers added together are: " + total);
</script>

        document.write("<p><strong>This text is in a paragraph tag!</strong></p>");

        document.getElementById("msg").innerHTML = "This is the \"msg\" &lt;div&gt; element.";
    </script>
