<!DOCTYPE html>

<html>
<head>
  <title>My Cart</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: Inter, sans-serif;
      background-color: #f5f5f5;
      margin: 0;
    }

    /* NAVBAR */
    .navbar {
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .nav-box {
      background: #ed2b91;
      padding: 15px 60px;
      border-radius: 30px;
      align-items: center;
      display: flex;
      gap: 150px;
    }

    .nav-box a {
      color: white;
      text-decoration: none;
      font-weight: bold;
    }

    /* PAGE */
    h1 {
      padding-left: 20px;
      margin-bottom: auto;
    }

    h2 {
      text-align: center;
      color: #ed2b91;
    }

    .container {
      display: flex;
      gap: 20px;
      padding: 20px;
    }

    h3 {
      margin: 1px;
    }
    .cart {
      flex: 2;
    }

    .item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: #f2c9df;
      padding: 15px;
      border-radius: 15px;
      margin-bottom: 15px;
    }

    .item img {
      width: 60px;
      border-radius: 10px;
    }

    .price {
        margin-left: 40px;
        margin-right: 20px;   
    }

    .info {
      flex: 1;
      margin-left: 10px;
    }

    .qty {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .qty button {
      background: hotpink;
      color: white;
      border: none;
      border-radius: 50%;
      width: 25px;
      height: 25px;
      cursor: pointer;
    }

    .summary {
      flex: 1;
      background: #f2c9df;
      padding: 20px;
      border-radius: 15px;
    }

    .summary input {
      width: 100%;
      padding: 5px;
      border-radius: 20px;
      border: 1px solid hotpink;
      text-align: center;
      margin-bottom: 10px;
    }

    hr {
      color: #ed2b91;
    }

    .summary button {
      width: 100%;
      padding: 8px;
      margin-bottom: 15px;
      border-radius: 20px;
      border: none;
      background: hotpink;
      color: white;
      cursor: pointer;
    }

    .summary p {
      display: flex;
      justify-content: space-between;
    }

    .checkout {
      background: black !important;
    }

    .checkout:hover {
      background: #333 !important;
    }

  </style>

</head>

<body>

<!-- NAVBAR -->

<div class="navbar">
  <div class="nav-box">
    <a href="#">Home</a>
    <a href="#"><b>Shop</b></a>
    <a href="#">About Us</a>
  </div>
</div>

<h1>My Cart</h1>

<div class="container">

  <!-- CART -->

  <div class="cart">


<div class="item">
  <img src="bottleimages/pink.jpg">
  <div class="info">
    <h3>Loved By God Bottle</h3>
    <small>Color: Pink</small>
  </div>

  <div class="qty">
    <button onclick="changeQty(0, -1)">-</button>
    <span id="qty0">1</span>
    <button onclick="changeQty(0, 1)">+</button>
  </div>

  <p class="price">$15</p>
</div>

<div class="item">
  <img src="bottleimages/red.jpg">
  <div class="info">
    <h3>Loved By God Bottle</h3>
    <small>Color: Red</small>
  </div>

  <div class="qty">
    <button onclick="changeQty(1, -1)">-</button>
    <span id="qty1">1</span>
    <button onclick="changeQty(1, 1)">+</button>
  </div>

  <p class="price">$15</p>
</div>

<div class="item">
  <img src="bottleimages/blue.jpg">
  <div class="info">
    <h3>Loved By God Bottle</h3>
    <small>Color: Blue</small>
  </div>

  <div class="qty">
    <button onclick="changeQty(2, -1)">-</button>
    <span id="qty2">1</span>
    <button onclick="changeQty(2, 1)">+</button>
  </div>

  <p class="price">$15</p>
</div>


  </div>

  <!-- SUMMARY -->

  <div class="summary">
    <h2>Order Summary</h2>


<input type="text" id="coupon" placeholder="Enter Coupon Code">
<button onclick="applyCoupon()">Apply Coupon</button>

<p>Subtotal <span id="subtotal">$0</span></p>
<p>Discount <span id="discount">$0</span></p>
<p>Delivery <span>$5</span></p>
<hr>
<p><b>Total</b> <span id="total">$0</span></p>

<button class="checkout">Checkout</button>


  </div>

</div>

<script>
  
  
  // Initialize variables
  let quantities = [1, 1, 1];
  let prices = [15, 15, 15];
  let discount = 0;
  
  function changeQty(index, change) {
  quantities[index] += change;

  if (quantities[index] < 1) {
    quantities[index] = 1;
  }

  // Update quantity display
  document.getElementById("qty" + index).innerHTML = quantities[index];

  // Recalculate totals
  updateTotal();
}

function updateTotal() {
  let subtotal = 0;

  for (let i = 0; i < prices.length; i++) {
    subtotal += prices[i] * quantities[i];
  }

  // Discount is percentage-based
  let discountAmount = subtotal * discount;

  let total = subtotal - discountAmount + 5;

  document.getElementById("subtotal").innerHTML = "$" + subtotal.toFixed(2);
  document.getElementById("discount").innerHTML = "-$" + discountAmount.toFixed(2);
  document.getElementById("total").innerHTML = "$" + total.toFixed(2);
}

function applyCoupon() {
  let code = document.getElementById("coupon").value;

  if (code === "SAVE10") {
    discount = 0.10; // 10%
  } else {
    discount = 0;
    alert("Invalid coupon code");
  }

  updateTotal();
}

  // Initial total calculation
  updateTotal();
  </script>
