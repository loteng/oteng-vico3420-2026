<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  
  <title>Galentine's Day 2026</title>

  <style>
body {
  margin: 0;
  font-family: "Playfair Display", serif;
  background-color: #F8DEDD;
}

h1 {
  color: #c70000;
}

#invite {
  display: flex;
  background-color: #F8DEDD;
  text-align: left;
  flex-direction: row;
}


.heroimage img{
  max-width: 100%;
  height: auto;
  border-radius: 6px;
  object-fit: cover;
  justify-content: center;
}

.invite-content {
  padding: 4rem 3rem;
  display: flex;
  flex-direction: column;
  flex-wrap: nowrap;
  justify-content: center;
}

.eyebrow {
  text-transform: uppercase;
  color: #c70000;
  font-size: 1.5rem;
}

h1.title {
  font-size: 4rem;
  margin: 0.5rem 0;
}

.description {
  font-size: 1.1rem;
  line-height: 1.6;
  margin: 1.5rem 0;
}

#btn {
  display: inline-block;
  background-color: #c70000;
  color: white;
  padding: 0.8rem 1.8rem;
  text-decoration: none;
}





/* ---------- Media Query ---------- */
@media screen and  (max-width: 500px) {

  #invite {
    display: flex;
    flex-wrap: wrap; 
    flex-direction: column;
    align-items: stretch;
    }           

 
}

  </style>
</head>

<body>


 <section id="invite">
    <div class="heroimage">
        <img src="/Week 3/images/galentinesinvite.png" alt="Galentine's Day Invite">
    </div>
    <div class="invite-content">
        <p class="eyebrow" style="letter-spacing: 0.15em;">
        HERE’S YOUR INVITE!
      </p>

      <h1 class="title">Galentine’s Day 2026</h1>

      <p class="description">
        Join us for a day of fun, laughter, and celebration of friendship!
        Let's make this Galentine's Day unforgettable with good company,
        delicious food, and lots of love.
      </p>
      <button id="btn">RSVP NOW</button>
    </div>
</section>

</body>
</html>
